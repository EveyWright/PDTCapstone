name: Restore F26Capstone Solution

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack Solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: solutions
          solution-file: F26Capstone_solution.zip

      - name: Import Solution
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.RESTORE_ENV_URL }}
          app-id: ${{ secrets.ACTIONS_CLIENT_ID }}
          client-secret: ${{ secrets.ACTIONS_CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}

          solution-file: F26Capstone_solution.zip
          force-overwrite: true
          publish-changes: true