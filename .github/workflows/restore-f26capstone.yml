name: Restore F26Capstone Solution

on:
  workflow_dispatch:
    inputs:
      solution-choice:
        description: 'Which solution to restore'
        required: true
        default: 'F26Capstone_solution.zip'
        type: choice
        options:
          - F26Capstone_solution.zip
          - New_F26Capstone_solution.zip

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Import Solution
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ secrets.RESTORE_ENV_URL }}
          app-id: ${{ secrets.ACTIONS_CLIENT_ID }}
          client-secret: ${{ secrets.ACTIONS_CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}

          solution-file: ${{ inputs.solution-choice }}
          force-overwrite: true
          publish-changes: true
          connection-references: |
            [
              {
                "logicalName": "new_sharedcommondataserviceforapps_38a62",
                "connectionId": ${{ secrets.DATAVERSE_CONNECTION_ID }}
              },
              {
                "logicalName": "new_sharedteams_19643",
                "connectionId": ${{ secrets.TEAMS_CONNECTION_ID }}
              }
            ]